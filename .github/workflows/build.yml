name: build-debug-apk
on: [workflow_dispatch, push]
permissions: {contents: write}
jobs: {build: {runs-on: ubuntu-latest, steps: [{uses: actions/checkout@v4}, {uses: actions/setup-java@v4, with: {distribution: temurin, java-version: '17'}}, {uses: gradle/actions/setup-gradle@v4, with: {gradle-version: '8.9'}}, {run: gradle assembleDebug --no-daemon}, {run: cp app/build/outputs/apk/debug/app-debug.apk zaeem-ai-debug.apk && sha256sum zaeem-ai-debug.apk > zaeem-ai-debug.apk.sha256}, {name: Publish release, env: {GH_TOKEN: '${{ github.token }}'}, run: "gh release delete latest -y --cleanup-tag || true; gh release create latest zaeem-ai-debug.apk zaeem-ai-debug.apk.sha256 --prerelease --title 'ZAEEM AI debug build' --notes 'Untested Milestone 1 debug shell.'"}]}}
