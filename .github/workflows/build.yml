name: build-debug-apk
on: [workflow_dispatch, push]
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log || { grep -E "^e: |What went wrong|Could not|Execution failed|> " build.log | head -25 | while IFS= read -r l; do echo "::error::${l:0:400}"; done; exit 1; }
      - run: cp app/build/outputs/apk/debug/app-debug.apk zaeem-ai-debug.apk && sha256sum zaeem-ai-debug.apk > zaeem-ai-debug.apk.sha256
      - name: Publish release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest zaeem-ai-debug.apk zaeem-ai-debug.apk.sha256 --prerelease --title "ZAEEM AI latest debug build" --notes "Debug build from CI. Not tested on a device by the build system."
